name: Publish One-time V2 Storage Migrator

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing or new prerelease tag to receive the one-time migrator assets
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-v2-storage-migrator
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish V2 storage migrator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Buf
        run: go install github.com/bufbuild/buf/cmd/buf@v1.68.1
      - name: Generate Protobuf sources
        run: buf generate
      - name: Test V2 storage migrator
        run: go test ./cmd/agent-compose-migrate/...
      - name: Build linux/amd64 and linux/arm64 assets
        run: ./scripts/build-v2-storage-migrator-binaries.sh ./upload-v2-storage-migrator
      - name: Verify binary architectures and checksums
        run: |
          set -euo pipefail
          readelf -h upload-v2-storage-migrator/agent-compose-v2-storage-migrator-linux-amd64 | grep -F 'Advanced Micro Devices X86-64'
          readelf -h upload-v2-storage-migrator/agent-compose-v2-storage-migrator-linux-arm64 | grep -F 'AArch64'
          (cd upload-v2-storage-migrator && sha256sum -c SHASUMS256.txt)
      - name: Publish one-time migrator prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --prerelease
            gh release upload "$RELEASE_TAG" upload-v2-storage-migrator/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" upload-v2-storage-migrator/* \
              --repo "$GITHUB_REPOSITORY" \
              --title 'agent-compose one-time V2 storage migrator' \
              --notes 'One-time Linux storage migration binaries. Run a dry run and back up the data root before use.' \
              --prerelease
          fi
